name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # telemetry-parser 0.3.x ships wheels only for CPython <=3.12; widen
        # this matrix when upstream releases wheels for newer CPythons.
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # [gui] included: without PySide the widget tests cannot even
          # collect (they import Qt directly), so the coverage gate below
          # would fail open instead of failing closed.
          pip install -e ".[dev,gui]"
      - name: Test
        # tests that need camera-original footage skip themselves
        run: python -m pytest steadycut -q
      - name: GUI coverage gate
        # Standing rule (CONTRIBUTING.md): every widget, handler, and
        # paint path in widgets.py runs in CI. QT_QPA_PLATFORM=offscreen
        # lets the QTest click/drag tests run headless.
        run: >
          QT_QPA_PLATFORM=offscreen python -m pytest
          steadycut/tests/test_gui_widgets.py
          steadycut/tests/test_proxy_gui.py
          steadycut/tests/test_proxy.py
          steadycut/tests/test_gui.py
          -q --cov=steadycut.gui.widgets --cov-fail-under=90
